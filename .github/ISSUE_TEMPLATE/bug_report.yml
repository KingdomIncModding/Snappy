name: Bug report
description: Report a problem you experienced with this mod.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe what you saw.
      placeholder: Explain the problem in your own words.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: How can it be repeated?
      description: List the steps, if you know them.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Mod version (if known)
    validations:
      required: false
